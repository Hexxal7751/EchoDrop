name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.echodrop --project-name echodrop .
          fi
          rm -f test/widget_test.dart

      - name: Patch permissions and minSdk
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO $M || sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application#' $M
          sed -i -E 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle*

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter test
        continue-on-error: true
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: EchoDrop-apk
          path: build/app/outputs/flutter-apk/app-release.apk